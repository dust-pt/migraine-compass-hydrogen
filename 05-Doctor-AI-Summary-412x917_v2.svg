<svg width="412" height="917" viewBox="0 0 412 917" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad5" x1="206" y1="0" x2="206" y2="917" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1422"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="ctaGrad5" x1="0" y1="0" x2="364" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Device Frame 412x917 -->
  <rect id="App Background" width="412" height="917" rx="36" fill="url(#bgGrad5)" stroke="#1E293B" stroke-width="2"/>

  <!-- Status Bar -->
  <g id="Status Bar" transform="translate(28, 16)">
    <text x="0" y="16" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="13" font-weight="600">09:41</text>
    <rect id="Dynamic Island" x="154" y="4" width="48" height="14" rx="7" fill="#05080F"/>
    <text x="356" y="16" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="end">5G · 94%</text>
  </g>

  <!-- Header -->
  <g id="Header" transform="translate(24, 56)">
    <text x="0" y="24" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="24" font-weight="700">Summary for my doctor</text>
    <text x="0" y="46" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12.5">AI-drafted 1-page brief · Review &amp; edit before sharing</text>
  </g>

  <!-- Clinical One-Page Document Card (Fixed Right Margins & Crisp Vector Icons) -->
  <g id="Card - Clinical Summary" transform="translate(24, 120)">
    <rect width="364" height="508" rx="24" fill="#131B2E" stroke="#2D3D5E" stroke-width="1.5"/>

    <!-- Top Badge -->
    <g id="Badge - AI Clinical Brief" transform="translate(20, 20)">
      <rect width="154" height="26" rx="13" fill="#1E2946"/>
      <path d="M18 8L19.4 11.6L23 13L19.4 14.4L18 18L16.6 14.4L13 13L16.6 11.6L18 8Z" fill="#A5B4FC"/>
      <text x="30" y="17" fill="#A5B4FC" font-family="Inter, sans-serif" font-size="10.5" font-weight="700">AI CLINICAL BRIEF</text>
    </g>

    <g id="Button - Tap to edit" transform="translate(268, 21)">
      <path d="M10 15.5H18M15.5 7.5L17.5 9.5L11.5 15.5H9.5V13.5L15.5 7.5Z" stroke="#818CF8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="23" y="16" fill="#818CF8" font-family="Inter, sans-serif" font-size="12" font-weight="600">Tap to edit</text>
    </g>

    <!-- Section 1: Overview -->
    <text x="20" y="72" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="15.5" font-weight="700">Past 7 Weeks Overview</text>
    <text x="20" y="94" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="12.5">4 migraine attacks logged (last episode: 15 days ago).</text>
    <line x1="20" y1="112" x2="344" y2="112" stroke="#24324F"/>

    <!-- Section 2: Logged Before Attacks -->
    <text x="20" y="140" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="14.5" font-weight="700">Logged before attacks (possibilities)</text>
    <circle cx="25" cy="162" r="2.2" fill="#818CF8"/>
    <text x="35" y="166" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12.2">3 of 4 attacks came after a trip (routine change)</text>
    <circle cx="25" cy="186" r="2.2" fill="#818CF8"/>
    <text x="35" y="190" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12.2">2 of 4 followed a late night (&lt;6h smartwatch sleep)</text>
    <circle cx="25" cy="210" r="2.2" fill="#818CF8"/>
    <text x="35" y="214" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12.2">2 of 4 coincided with stress &amp; pressure drop</text>
    <circle cx="25" cy="234" r="2.2" fill="#818CF8"/>
    <text x="35" y="238" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12.2">Sun exposure logged before 2 episodes</text>
    <line x1="20" y1="258" x2="344" y2="258" stroke="#24324F"/>

    <!-- Section 3: Relief & Medication -->
    <text x="20" y="286" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="14.5" font-weight="700">Medication &amp; what helped</text>
    <circle cx="25" cy="308" r="2.2" fill="#34D399"/>
    <text x="35" y="312" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12.2">Rescue medication taken in 3 of 4 attacks</text>
    <circle cx="25" cy="332" r="2.2" fill="#34D399"/>
    <text x="35" y="336" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12.2">Dark quiet room &amp; rest helped in all 4 attacks</text>
    <circle cx="25" cy="356" r="2.2" fill="#34D399"/>
    <text x="35" y="360" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12.2">Coffee reported as helpful when taken early</text>
    <line x1="20" y1="380" x2="344" y2="380" stroke="#24324F"/>

    <!-- Section 4: Own Words -->
    <text x="20" y="408" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="14.5" font-weight="700">Patient notes (in their own words)</text>
    <text x="20" y="434" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12.5" font-style="italic">“Long walk after lunch, noisy office, skipped lunch.”</text>

    <rect x="20" y="458" width="324" height="32" rx="10" fill="#101726"/>
    <text x="182" y="478" fill="#64748B" font-family="Inter, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Reports only what was logged · Checked by patient first</text>
  </g>

  <!-- Action Buttons (Crisp Vector Envelope Icon instead of Grey Emoji) -->
  <g id="Footer Actions" transform="translate(24, 650)">
    <rect width="364" height="56" rx="18" fill="url(#ctaGrad5)"/>
    <g id="Icon - Email" transform="translate(68, 21)">
      <rect x="0" y="0" width="18" height="14" rx="2.5" stroke="#FFFFFF" stroke-width="1.8"/>
      <path d="M1.5 2L9 8L16.5 2" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="196" y="34" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">Send by email to my doctor</text>

    <g id="Button - Fullscreen" transform="translate(0, 68)">
      <rect width="364" height="50" rx="16" fill="#131B2E" stroke="#293756"/>
      <text x="182" y="31" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Show fullscreen at appointment</text>
    </g>
  </g>

  <!-- Bottom Navigation Bar -->
  <g id="Bottom Navigation" transform="translate(0, 825)">
    <rect width="412" height="92" fill="#0B0F1A"/>
    <line x1="0" y1="0" x2="412" y2="0" stroke="#1E293B" stroke-width="1"/>

    <g id="Tab 1 - Today" transform="translate(24, 14)">
      <circle cx="44" cy="14" r="5" fill="#64748B"/>
      <text x="44" y="44" fill="#64748B" font-family="Inter, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Today</text>
    </g>

    <g id="Tab 2 - Check-in" transform="translate(116, 14)">
      <path d="M44 8V20M38 14H50" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>
      <text x="44" y="44" fill="#64748B" font-family="Inter, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Check-in</text>
    </g>

    <g id="Tab 3 - History" transform="translate(208, 14)">
      <rect x="37" y="8" width="14" height="12" rx="2" stroke="#64748B" stroke-width="1.5"/>
      <line x1="40" y1="12" x2="48" y2="12" stroke="#64748B" stroke-width="1.3"/>
      <line x1="40" y1="16" x2="46" y2="16" stroke="#64748B" stroke-width="1.3"/>
      <text x="44" y="44" fill="#64748B" font-family="Inter, sans-serif" font-size="11" font-weight="500" text-anchor="middle">History</text>
    </g>

    <g id="Tab 4 - Doctor AI (Active)" transform="translate(300, 14)">
      <rect x="14" y="0" width="60" height="28" rx="14" fill="#1E2946"/>
      <path d="M44 7L45.8 12.2L51 14L45.8 15.8L44 21L42.2 15.8L37 14L42.2 12.2L44 7Z" fill="#818CF8"/>
      <text x="44" y="44" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Doctor AI</text>
    </g>

    <rect id="Home Indicator" x="138" y="78" width="136" height="5" rx="2.5" fill="#334155"/>
  </g>
</svg>