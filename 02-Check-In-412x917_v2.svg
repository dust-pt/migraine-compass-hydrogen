    <g id="Tab 2 - Check-in (Active)" transform="translate(116, 14)">
      <rect x="14" y="0" width="60" height="28" rx="14" fill="#1E2946"/>
      <path d="M44 8V20M38 14H50" stroke="#818CF8" stroke-width="2" stroke-linecap="round"/>
      <text x="44" y="44" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Check-in</text>
