    <path d="M28 21V31M23 26H33" stroke="#A5B4FC" stroke-width="1.6" stroke-linecap="round"/>
    <text x="52" y="31" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="13" font-weight="600">Add something else (in your own words)</text>
    <path d="M336 26H346M346 26L342 22M346 26L342 30" stroke="#818CF8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sticky Action Row -->
