<svg width="412" height="917" viewBox="0 0 412 917" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="206" y1="0" x2="206" y2="917" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1422"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="ctaGrad2" x1="0" y1="0" x2="232" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Device Frame 412x917 -->
  <rect id="App Background" width="412" height="917" rx="36" fill="url(#bgGrad2)" stroke="#1E293B" stroke-width="2"/>

  <!-- Status Bar -->
  <g id="Status Bar" transform="translate(28, 16)">
    <text x="0" y="16" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="13" font-weight="600">09:41</text>
    <rect id="Dynamic Island" x="154" y="4" width="48" height="14" rx="7" fill="#05080F"/>
    <text x="356" y="16" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="end">5G · 94%</text>
  </g>

  <!-- Header with Skip -->
  <g id="Header" transform="translate(24, 56)">
    <text x="0" y="24" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="24" font-weight="700">How was it?</text>
    <rect x="148" y="6" width="76" height="22" rx="11" fill="#172033"/>
    <text x="186" y="21" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Optional</text>
    <text x="364" y="22" fill="#818CF8" font-family="Inter, sans-serif" font-size="13" font-weight="600" text-anchor="end">Skip for now</text>
    <text x="0" y="46" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">Tap any chip that applies · Leave the rest alone</text>
  </g>

  <!-- Auto-Filled Banner -->
  <g id="Auto-Filled Pill Strip" transform="translate(24, 116)">
    <rect width="364" height="58" rx="16" fill="#131B2E" stroke="#24324F"/>
