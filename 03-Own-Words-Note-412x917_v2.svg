<svg width="412" height="917" viewBox="0 0 412 917" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad3" x1="206" y1="0" x2="206" y2="917" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1422"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="ctaGrad3" x1="0" y1="0" x2="364" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Device Frame 412x917 -->
  <rect id="App Background" width="412" height="917" rx="36" fill="url(#bgGrad3)" stroke="#1E293B" stroke-width="2"/>

  <!-- Status Bar -->
  <g id="Status Bar" transform="translate(28, 16)">
    <text x="0" y="16" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="13" font-weight="600">09:41</text>
    <rect id="Dynamic Island" x="154" y="4" width="48" height="14" rx="7" fill="#05080F"/>
    <text x="356" y="16" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="end">5G · 94%</text>
  </g>

  <!-- Top Navigation Row -->
  <g id="Header" transform="translate(24, 58)">
    <path d="M12 13H2M2 13L6 9M2 13L6 17" stroke="#818CF8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="18" y="18" fill="#818CF8" font-family="Inter, sans-serif" font-size="13.5" font-weight="600">Back to check-in</text>
    <rect x="272" y="2" width="92" height="24" rx="12" fill="#172033"/>
    <text x="318" y="18" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Optional</text>

    <text x="0" y="60" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="26" font-weight="700">Add something else</text>
    <text x="0" y="86" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13.5">Anything different today? Write it in your own words.</text>
    <text x="0" y="106" fill="#64748B" font-family="Inter, sans-serif" font-size="12">Predefined chips cannot cover everything — never required.</text>
  </g>

  <!-- Modern Text Editor Card -->
  <g id="Card - Free Text Note" transform="translate(24, 186)">
    <rect width="364" height="290" rx="24" fill="#131B2E" stroke="#2D3D5E" stroke-width="1.5"/>

    <text x="22" y="40" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="15">Long walk after lunch, noisy office,</text>
    <text x="22" y="64" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="15">skipped lunch...</text>
    <line id="Text Cursor" x1="138" y1="49" x2="138" y2="67" stroke="#818CF8" stroke-width="2" stroke-linecap="round"/>

    <line x1="22" y1="234" x2="342" y2="234" stroke="#1E293B"/>
    <path d="M28 252L29.5 256.5L34 258L29.5 259.5L28 264L26.5 259.5L22 258L26.5 256.5L28 252Z" fill="#818CF8"/>
    <text x="40" y="262" fill="#818CF8" font-family="Inter, sans-serif" font-size="12" font-weight="500">Included when AI drafts your doctor summary</text>
  </g>

  <!-- Quick Context Suggestions -->
  <g id="Quick Suggestions" transform="translate(24, 498)">
    <text x="4" y="16" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12.5" font-weight="600">Quick-insert examples</text>

    <g id="Suggestion 1" transform="translate(0, 28)">
      <rect width="172" height="36" rx="18" fill="#131B2E" stroke="#24324F"/>
      <text x="86" y="23" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="12" font-weight="500" text-anchor="middle">+ Took pill at first sign</text>
    </g>
    <g id="Suggestion 2" transform="translate(182, 28)">
      <rect width="182" height="36" rx="18" fill="#131B2E" stroke="#24324F"/>
      <text x="91" y="23" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="12" font-weight="500" text-anchor="middle">+ Coffee helped early on</text>
    </g>
    <g id="Suggestion 3" transform="translate(0, 74)">
      <rect width="172" height="36" rx="18" fill="#131B2E" stroke="#24324F"/>
      <text x="86" y="23" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="12" font-weight="500" text-anchor="middle">+ Bright screen all day</text>
    </g>
    <g id="Suggestion 4" transform="translate(182, 74)">
      <rect width="148" height="36" rx="18" fill="#131B2E" stroke="#24324F"/>
      <text x="74" y="23" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="12" font-weight="500" text-anchor="middle">+ Long commute</text>
    </g>
  </g>

  <!-- Bottom Action Buttons -->
  <g id="Footer Buttons" transform="translate(24, 672)">
    <rect width="364" height="58" rx="18" fill="url(#ctaGrad3)"/>
    <text x="182" y="35" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Save note</text>

    <g id="Button - Back" transform="translate(0, 70)">
      <rect width="364" height="52" rx="16" fill="#131B2E" stroke="#293756"/>
      <text x="182" y="31" fill="#94A3B8" font-family="Inter, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">Back to check-in</text>
    </g>
  </g>

  <!-- Bottom Navigation Bar -->
  <g id="Bottom Navigation" transform="translate(0, 825)">
    <rect width="412" height="92" fill="#0B0F1A"/>
    <line x1="0" y1="0" x2="412" y2="0" stroke="#1E293B" stroke-width="1"/>

    <g id="Tab 1 - Today" transform="translate(24, 14)">
      <circle cx="44" cy="14" r="5" fill="#64748B"/>
      <text x="44" y="44" fill="#64748B" font-family="Inter, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Today</text>
    </g>

    <g id="Tab 2 - Check-in (Active)" transform="translate(116, 14)">
      <rect x="14" y="0" width="60" height="28" rx="14" fill="#1E2946"/>
      <path d="M44 8V20M38 14H50" stroke="#818CF8" stroke-width="2" stroke-linecap="round"/>
      <text x="44" y="44" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Check-in</text>
    </g>

    <g id="Tab 3 - History" transform="translate(208, 14)">
      <rect x="37" y="8" width="14" height="12" rx="2" stroke="#64748B" stroke-width="1.5"/>
      <line x1="40" y1="12" x2="48" y2="12" stroke="#64748B" stroke-width="1.3"/>
      <line x1="40" y1="16" x2="46" y2="16" stroke="#64748B" stroke-width="1.3"/>
      <text x="44" y="44" fill="#64748B" font-family="Inter, sans-serif" font-size="11" font-weight="500" text-anchor="middle">History</text>
    </g>

    <g id="Tab 4 - Doctor AI" transform="translate(300, 14)">
      <path d="M44 7L45.8 12.2L51 14L45.8 15.8L44 21L42.2 15.8L37 14L42.2 12.2L44 7Z" fill="#64748B"/>
      <text x="44" y="44" fill="#64748B" font-family="Inter, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Doctor AI</text>
    </g>

    <rect id="Home Indicator" x="138" y="78" width="136" height="5" rx="2.5" fill="#334155"/>
  </g>
</svg>