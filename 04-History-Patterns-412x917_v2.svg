<svg width="412" height="917" viewBox="0 0 412 917" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad4" x1="206" y1="0" x2="206" y2="917" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1422"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="ctaGrad4" x1="0" y1="0" x2="364" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Device Frame 412x917 -->
  <rect id="App Background" width="412" height="917" rx="36" fill="url(#bgGrad4)" stroke="#1E293B" stroke-width="2"/>

  <!-- Status Bar -->
  <g id="Status Bar" transform="translate(28, 16)">
    <text x="0" y="16" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="13" font-weight="600">09:41</text>
    <rect id="Dynamic Island" x="154" y="4" width="48" height="14" rx="7" fill="#05080F"/>
    <text x="356" y="16" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="end">5G · 94%</text>
  </g>

  <!-- Header -->
  <g id="Header" transform="translate(24, 58)">
    <text x="0" y="26" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="26" font-weight="700">History: past 7 weeks</text>
    <text x="0" y="48" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">Plain look back at logged attacks · No predictions</text>
  </g>

  <!-- 7-Week Timeline Card (4 Attacks Logged matches 4 active bars: 7w, 5w, 4w, 2w) -->
  <g id="Card - 7 Week Chart" transform="translate(24, 124)">
    <rect width="364" height="176" rx="24" fill="#131B2E" stroke="#24324F" stroke-width="1.5"/>
    <text x="20" y="30" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="14" font-weight="600">Weekly overview</text>
    <text x="344" y="30" fill="#818CF8" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" text-anchor="end">4 attacks logged</text>

    <!-- 7 Bars (7w, 5w, 4w, 2w = 4 attacks logged, last one 2w/15 days ago) -->
    <g id="Chart Bars" transform="translate(22, 48)">
      <g id="Week 7w (1 Attack)" transform="translate(0, 0)">
        <rect width="36" height="76" rx="10" fill="#312E81" stroke="#818CF8" stroke-width="1.8"/>
        <circle cx="18" cy="38" r="5" fill="#A5B4FC"/>
        <text x="18" y="96" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">7w</text>
      </g>
      <g id="Week 6w (Clear)" transform="translate(47, 0)">
        <rect width="36" height="76" rx="10" fill="#192338" stroke="#263450"/>
        <text x="18" y="96" fill="#64748B" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">6w</text>
      </g>
      <g id="Week 5w (1 Attack)" transform="translate(94, 0)">
        <rect width="36" height="76" rx="10" fill="#312E81" stroke="#818CF8" stroke-width="1.8"/>
        <circle cx="18" cy="38" r="5" fill="#A5B4FC"/>
        <text x="18" y="96" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">5w</text>
      </g>
      <g id="Week 4w (1 Attack)" transform="translate(141, 0)">
        <rect width="36" height="76" rx="10" fill="#312E81" stroke="#818CF8" stroke-width="1.8"/>
        <circle cx="18" cy="38" r="5" fill="#A5B4FC"/>
        <text x="18" y="96" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">4w</text>
      </g>
      <g id="Week 3w (Clear)" transform="translate(188, 0)">
        <rect width="36" height="76" rx="10" fill="#192338" stroke="#263450"/>
        <text x="18" y="96" fill="#64748B" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">3w</text>
      </g>
      <g id="Week 2w (1 Attack - 15d ago)" transform="translate(235, 0)">
        <rect width="36" height="76" rx="10" fill="#312E81" stroke="#818CF8" stroke-width="1.8"/>
        <circle cx="18" cy="38" r="5" fill="#A5B4FC"/>
        <text x="18" y="96" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2w</text>
      </g>
      <g id="Week 1w (Clear)" transform="translate(282, 0)">
        <rect width="36" height="76" rx="10" fill="#192338" stroke="#263450"/>
        <text x="18" y="96" fill="#64748B" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">1w</text>
      </g>
    </g>
  </g>

  <!-- Card: Before these attacks (Plain Counts + Visual Bars) -->
  <g id="Card - Before These Attacks" transform="translate(24, 316)">
    <rect width="364" height="264" rx="24" fill="#131B2E" stroke="#24324F" stroke-width="1.5"/>
    <text x="22" y="34" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="18" font-weight="700">Before these attacks</text>
    <text x="22" y="54" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12.5">What was logged before your last 4 attacks</text>

    <!-- Row 1: 3 of 4 after a trip -->
    <g id="Count 1 - After a trip" transform="translate(22, 74)">
      <text x="0" y="16" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="14.5" font-weight="600">After a trip</text>
      <text x="320" y="16" fill="#A5B4FC" font-family="Inter, sans-serif" font-size="13.5" font-weight="700" text-anchor="end">3 of 4</text>
      <rect x="0" y="26" width="320" height="10" rx="5" fill="#1E293B"/>
      <rect x="0" y="26" width="240" height="10" rx="5" fill="#6366F1"/>
    </g>

    <!-- Row 2: 2 of 4 a late night -->
    <g id="Count 2 - Late night" transform="translate(22, 134)">
      <text x="0" y="16" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="14.5" font-weight="600">A late night (&lt;6h sleep)</text>
      <text x="320" y="16" fill="#A5B4FC" font-family="Inter, sans-serif" font-size="13.5" font-weight="700" text-anchor="end">2 of 4</text>
      <rect x="0" y="26" width="320" height="10" rx="5" fill="#1E293B"/>
      <rect x="0" y="26" width="160" height="10" rx="5" fill="#818CF8"/>
    </g>

    <!-- Row 3: 2 of 4 stressed -->
    <g id="Count 3 - Stressed" transform="translate(22, 194)">
      <text x="0" y="16" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="14.5" font-weight="600">Stressed</text>
      <text x="320" y="16" fill="#A5B4FC" font-family="Inter, sans-serif" font-size="13.5" font-weight="700" text-anchor="end">2 of 4</text>
      <rect x="0" y="26" width="320" height="10" rx="5" fill="#1E293B"/>
      <rect x="0" y="26" width="160" height="10" rx="5" fill="#818CF8"/>
    </g>
  </g>

  <!-- Disclaimer Banner: Possibilities, not causes (Fixed 2-line wrap + Vector Icon) -->
  <g id="Banner - Possibilities not causes" transform="translate(24, 598)">
    <rect width="364" height="84" rx="18" fill="#111827" stroke="#263450"/>
    <circle cx="28" cy="24" r="7" stroke="#818CF8" stroke-width="1.5"/>
    <line x1="28" y1="23" x2="28" y2="28" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="28" cy="20.5" r="0.8" fill="#818CF8"/>
    <text x="42" y="28" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="13.5" font-weight="600">Possibilities, not causes</text>
    <text x="20" y="50" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Simple counts of what was logged — take this</text>
    <text x="20" y="67" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">to your doctor to discuss patterns together.</text>
  </g>

  <!-- Primary CTA: AI summary for my doctor -->
  <g id="CTA - AI Summary" transform="translate(24, 708)">
    <rect width="364" height="60" rx="18" fill="url(#ctaGrad4)"/>
    <path d="M84 24L86 29L91 31L86 33L84 38L82 33L77 31L82 29L84 24Z" fill="#FFFFFF"/>
    <text x="194" y="36" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">AI summary for my doctor</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g id="Bottom Navigation" transform="translate(0, 825)">
    <rect width="412" height="92" fill="#0B0F1A"/>
    <line x1="0" y1="0" x2="412" y2="0" stroke="#1E293B" stroke-width="1"/>

    <g id="Tab 1 - Today" transform="translate(24, 14)">
      <circle cx="44" cy="14" r="5" fill="#64748B"/>
      <text x="44" y="44" fill="#64748B" font-family="Inter, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Today</text>
    </g>

    <g id="Tab 2 - Check-in" transform="translate(116, 14)">
      <path d="M44 8V20M38 14H50" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>
      <text x="44" y="44" fill="#64748B" font-family="Inter, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Check-in</text>
    </g>

    <g id="Tab 3 - History (Active)" transform="translate(208, 14)">
      <rect x="14" y="0" width="60" height="28" rx="14" fill="#1E2946"/>
      <rect x="37" y="8" width="14" height="12" rx="2" stroke="#818CF8" stroke-width="1.6"/>
      <line x1="40" y1="12" x2="48" y2="12" stroke="#818CF8" stroke-width="1.4"/>
      <line x1="40" y1="16" x2="46" y2="16" stroke="#818CF8" stroke-width="1.4"/>
      <text x="44" y="44" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">History</text>
    </g>

    <g id="Tab 4 - Doctor AI" transform="translate(300, 14)">
      <path d="M44 7L45.8 12.2L51 14L45.8 15.8L44 21L42.2 15.8L37 14L42.2 12.2L44 7Z" fill="#64748B"/>
      <text x="44" y="44" fill="#64748B" font-family="Inter, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Doctor AI</text>
    </g>

    <rect id="Home Indicator" x="138" y="78" width="136" height="5" rx="2.5" fill="#334155"/>
  </g>
</svg>